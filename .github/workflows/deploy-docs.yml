name: Deploy docs

# Builds the MkDocs site and publishes it to two places from ONE artifact:
#
#   1. Cloudflare Pages (primary host) - https://autoboat-docs.pages.dev/
#      https://autoboat.aoe.vt.edu/documentation/ frames this site, so this is
#      the copy the team actually reads.
#   2. GitHub Pages (gh-pages branch) - https://autoboat-vt.github.io/documentation/
#      Kept because it is the URL people already have bookmarked and linked.
#
# Both are deployed from the same `site/` directory in the same run, so they
# cannot drift apart. Deploying only one of them is how the two URLs would end
# up showing different content.
#
# REQUIRED REPOSITORY SECRETS (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   Account -> Cloudflare Pages -> Edit
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard URL, or `wrangler whoami`
#
# Without those two secrets the Cloudflare steps fail. That is deliberate: a
# silent skip would leave the VT page framing a stale deployment.

on:
    push:
        branches: [main]
    # Manual re-deploy without an empty commit (e.g. after rotating the API token).
    workflow_dispatch:

# `contents: write` is what lets `mkdocs gh-deploy` push the gh-pages branch
# using the automatic GITHUB_TOKEN.
permissions:
    contents: write

# Never run two deploys at once. Not cancel-in-progress: cancelling mid-push
# could leave gh-pages pointing at a half-written tree.
concurrency:
    group: deploy-docs
    cancel-in-progress: false

env:
    # Cloudflare Pages project name. The pages.dev URL is derived from it, so
    # changing this changes the docs URL.
    #
    # WARNING: website/public/documentation/index.html frames
    # https://autoboat-docs.pages.dev/ and has this name baked into the iframe
    # `src`. If you rename the project, update that file in the website repo in
    # the same change, or the VT page will frame a 404.
    #
    # NOTE: mkdocs-material prints a "reaches end of life" notice on every build,
    # and MkDocs warns about pages missing from `nav:`. Both are informational and
    # do not fail --strict. Several pages are intentionally unlisted, so do not
    # "fix" that warning by deleting the files or wiring them into nav.
    PAGES_PROJECT: autoboat-docs

jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  # gh-deploy needs the existing gh-pages history to push onto.
                  fetch-depth: 0

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  # Pinned explicitly rather than read from .python-version: that file
                  # holds a local pyenv environment NAME ("autoboat-docs"), not a
                  # version, so setup-python's automatic detection cannot use it.
                  python-version: "3.12"
                  cache: pip
                  cache-dependency-path: requirements.txt

            - name: Install dependencies
              run: pip install -r requirements.txt

            # --strict turns broken links, missing images, and nav errors into build
            # failures. Without it a typo'd relative path deploys as a silent 404,
            # which is exactly the class of bug this site has hit before.
            #
            # SITE_URL is derived from PAGES_PROJECT rather than written out twice, so
            # the canonical URLs cannot disagree with the hostname actually deployed.
            # mkdocs.yml reads it via `!ENV [SITE_URL, <default>]`.
            - name: Build site (strict)
              env:
                  SITE_URL: https://${{ env.PAGES_PROJECT }}.pages.dev/
              run: mkdocs build --strict --clean

            # `wrangler pages deploy` fails on a project that does not exist yet, and
            # it cannot be created interactively in CI. Create it if missing, but
            # still fail loudly on anything that is not "already exists" -- a bad
            # token must not be mistaken for an existing project.
            - name: Ensure Cloudflare Pages project exists
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  set -o pipefail
                  if output=$(npx --yes wrangler@4 pages project create "$PAGES_PROJECT" \
                      --production-branch=main 2>&1); then
                    echo "$output"
                  elif grep -qi 'already exists' <<<"$output"; then
                    echo "Project '$PAGES_PROJECT' already exists; reusing it."
                  else
                    echo "$output" >&2
                    echo "Could not create or confirm the Pages project." >&2
                    exit 1
                  fi

            - name: Deploy to Cloudflare Pages
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
              run: |
                  npx --yes wrangler@4 pages deploy site \
                    --project-name="$PAGES_PROJECT" \
                    --branch=main

            # --force because `mkdocs gh-deploy` refuses to push when the local build
            # does not fast-forward onto the existing gh-pages history, which happens
            # routinely here: scripts/release.sh can also write that branch.
            - name: Deploy to GitHub Pages
              run: mkdocs gh-deploy --force

            - name: Summary
              run: |
                  {
                    echo "### Docs deployed"
                    echo
                    echo "- Cloudflare: https://$PAGES_PROJECT.pages.dev/"
                    echo "- GitHub Pages: https://autoboat-vt.github.io/documentation/"
                    echo "- Entry point: https://autoboat.aoe.vt.edu/documentation/"
                    echo
                    echo "Source commit: \`$GITHUB_SHA\`"
                  } >> "$GITHUB_STEP_SUMMARY"
